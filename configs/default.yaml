runtime:
  seed: 42
  device: auto
  use_amp: true
  deterministic: true
  cpu_threads: 4
data_loader:
  batch_size: 16
  num_workers: 0
  pin_memory: true
dataset:
  format: folders
  roots: []
  classes: null
  extensions: [.jpg, .jpeg, .png, .bmp, .tif, .tiff]
  recursive: true
  manifest: null
  path_column: image_path
  label_column: label
  group_column: null
  group_regex: null
  validate_images: true
  duplicates: error
  split:
    ratios: {train: 0.70, val: 0.15, test: 0.15}
    strategy: stratified
    seed: 42
  transforms:
    image_size: 224
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    augmentation:
      horizontal_flip: 0.0
      vertical_flip: 0.0
      rotation: 0.0
model:
  backbone:
    name: vit_b_16
    pretrained: true
    freeze_blocks: 8
    freeze_patch_embedding: true
    freeze_cls_token: true
    freeze_position_embedding: true
  selector:
    enabled: true
    mode: learned
    num_tokens: 31
    hidden_dim: 256
    dropout: 0.1
    spatial_smoothing: 3
    gumbel_noise: true
    temperature_start: 1.0
    temperature_end: 0.5
  projector:
    enabled: true
    hidden_dim: 512
    output_dim: 384
    dropout: 0.2
  graph:
    enabled: true
    topology: grid
    connectivity: 8
    cls_hub: true
    self_loops: false
    hidden_dim: 384
    layers: 4
    dropout: 0.3
    pooling: mean_max
  head:
    hidden_dim: 512
    dropout: 0.4
training:
  folds: 5
  epochs: 20
  cv_pool: train
  learning_rate: 0.0001
  backbone_learning_rate: 0.00001
  weight_decay: 0.05
  grad_clip: 1.0
  scheduler: cosine
  selection_metric: macro_f1
  output_dir: runs/neurosage
loss:
  label_smoothing: 0.1
  selection_overlap_weight: 0.0
cache:
  enabled: false
  directory: cache/features
  feature_noise_std: 0.01
  token_dropout: 0.05
evaluation:
  num_visualizations: 24
  dpi: 160
  save_token_overlays: true
